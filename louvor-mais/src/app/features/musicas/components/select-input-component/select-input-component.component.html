<div class="form-group">
    <select 
        class="select-field"
        [value]="value"
        (change)="handleSelectChange($event)" 
        (blur)="onTouched()"
    >
    
        <option value="" disabled selected hidden *ngIf="!value">{{ placeholder }}</option>
        <option *ngFor="let opt of options" [value]="opt.value">{{ opt.label }}</option>
    </select>
</div>
