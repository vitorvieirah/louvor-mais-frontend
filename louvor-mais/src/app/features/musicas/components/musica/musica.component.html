<div class="music-item" (click)="onMusicaClick()">
    <div class="music-info">
        <h3 class="music-title">{{ dados.nome }}</h3>

        <p class="music-details">Tom: {{ dados.tom }}</p>
        <p class="music-details">Versão: {{ dados.versao }}</p>
        <p class="music-details">Dificuldade: {{ dados.dificuldade }}</p>

    </div>
    <button class="link-button" (click)="copiarTexto()">Link</button>
</div>
