<form class="form" #form="ngForm" (ngSubmit)="salvar(form)">
  <div class="form-group">
    <label class="form-label" for="nome">Nome da música</label>
    <app-input-forms 
      id="nome"
      placeholder="Digite o nome da música" 
      [(ngModel)]="musica.nome" 
      name="nome"
      class="form-input">
    </app-input-forms>
  </div>

  <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="tom">Tom da música</label>
        <app-select-input-component
          id="tom"
          placeholder="Selecione o tom"
          [(ngModel)]="musica.tom"
          name="tom"
          [options]="tons"
          required
          class="form-select">
        </app-select-input-component>
      </div>
  
      <div class="form-group">
        <label class="form-label" for="clima">Clima</label>
        <app-select-input-component
          id="clima"
          placeholder="Selecione o clima"
          [(ngModel)]="musica.clima"
          name="clima"
          [options]="climas"
          required
          class="form-select">
        </app-select-input-component>
      </div>
    </div>
  
    <div class="form-group">
      <label class="form-label" for="artista">Artista</label>
      <app-input-forms 
        id="artista"
        placeholder="Digite o nome do artista" 
        [(ngModel)]="musica.artista" 
        name="artista"
        class="form-input">
      </app-input-forms>
    </div>

  <div class="form-row">
    <div class="form-group">
      <label class="form-label" for="bpm">BPM</label>
      <app-input-forms 
        id="bpm"
        placeholder="Ex: 120" 
        [(ngModel)]="musica.bpm" 
        name="bpm"
        type="number"
        class="form-input">
      </app-input-forms>
    </div>

    <div class="form-group">
      <label class="form-label" for="compositor">Compositor</label>
      <app-input-forms 
        id="compositor"
        placeholder="Digite o nome do compositor" 
        [(ngModel)]="musica.compositor" 
        name="compositor"
        class="form-input">
      </app-input-forms>
    </div>
  </div>

  <div class="form-group">
    <label class="form-label" for="link">Link da música</label>
    <app-input-forms 
      id="link"
      placeholder="https://exemplo.com/musica" 
      [(ngModel)]="musica.link" 
      name="link"
      type="url"
      class="form-input">
    </app-input-forms>
  </div>

  <div class="form-group">
    <label class="form-label" for="cifra">Cifra da música</label>
    <app-input-forms 
      id="cifra"
      placeholder="Cole aqui o link da cifra"
      [(ngModel)]="musica.cifra" 
      name="cifra"
      type="textarea"
      class="form-textarea">
    </app-input-forms>
  </div>

  <button class="save-button" type="submit">
    <span class="button-text">Salvar música</span>
  </button>
</form>
