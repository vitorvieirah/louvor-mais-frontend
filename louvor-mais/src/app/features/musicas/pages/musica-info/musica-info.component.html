<header class="header">
    <app-botao-voltar url="/musicas"></app-botao-voltar>
    <div class="action-buttons">
        <button (click)="abrirModalEditar()" class="edit-button">Editar</button>
        <button (click)="abrirModalDeletar()" class="delete-button">Excluir</button>
    </div>
</header>
<main class="app-container">
    <h1 class="music-title">{{dados.nome}}</h1>
    <div class="section technical-data">
        <h2 class="section-title">Dados técnicos</h2>
        <p class="data-item">Versão da música: {{dados.versao}}</p>
        <p class="data-item">Tom da música: {{dados.tom}}</p>
        <p class="data-item">Link da música:</p> <a href="https://linkdamusica.com"><span
                class="link">{{dados.link}}</span></a>
        <p class="data-item">Cifra da música:</p> <a href="https://ciframusica.com"><span
                class="link">{{dados.cifra}}</span></a>
    </div>
    <app-modal-deletar *ngIf="modalDeletar" (fecharModal)="fecharModalDeletar()" (confirmarExclusao)="excluirMusica()"></app-modal-deletar>
    <app-modal-editar *ngIf="modalEditar" [musica]="dados" (fecharModal)="fecharModalEditar()" (musicaAtualizada)="atualizarDados()"></app-modal-editar>
    
</main>
