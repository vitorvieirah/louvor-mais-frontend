<select 
    class="select-field"
    [(ngModel)]="value"
    (ngModelChange)="onSelect($event)"
    (blur)="onTouched()"
>
    <option [value]="''" disabled hidden>{{ placeholder }}</option>
    <option *ngFor="let opt of options" [value]="opt.value">
        {{ opt.label }}
    </option>
</select>
