<header class="header">
  <app-botao-voltar url="/musicas" class="back-button"></app-botao-voltar>
  <h1 class="header-title">Cadastro de música</h1>
</header>

<main>
  <div class="form-container">
    <app-forms-cadastro-musica
      (musicaSalva)="mostrarNotificacao()"
    ></app-forms-cadastro-musica>
  </div>
</main>

<div class="notificacao" *ngIf="notificacaoVisivel" [@slideIn]>
  <span class="notificacao-icon">✓</span>
  Música salva com sucesso!
</div>
