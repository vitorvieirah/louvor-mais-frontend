<div class="music-card" (click)="onMusicaClick()">
  <div class="music-header">
    <div class="music-title-section">
      <h3 class="music-title">{{ dados.nome }}</h3>
      <div class="music-badges">
        <span class="badge badge-tom">{{ dados.tom }}</span>
        <span class="badge badge-dificuldade" [class]="'difficulty-' + dados.dificuldade.toLowerCase()">
          {{ dados.dificuldade }}
        </span>
      </div>
    </div>
  </div>
  
  <div class="music-details">
    <div class="detail-item">
      <span class="detail-label">Versão:</span>
      <span class="detail-value">{{ dados.versao }}</span>
    </div>
  </div>
  
  <div class="music-footer">
    <div class="music-meta">
      <span class="meta-icon">🎵</span>
      <span class="meta-text">Clique para ver detalhes</span>
    </div>
  </div>
</div>
